
version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: doc_inteligence_api_development
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doc_inteligence_api_development
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
