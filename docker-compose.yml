
services:
  db:
    image: postgres:16-alpine
    container_name: doc_inteligence_api_db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-doc_inteligence_api_development}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: doc_inteligence_api_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: doc_inteligence_api_app
    command: ["./bin/thrust", "./bin/rails", "server", "-b", "0.0.0.0", "-p", "3000"]
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379/1
      XAI_API_KEY: ${XAI_API_KEY:-}
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/rails/storage

  worker:
    build: .
    container_name: doc_inteligence_api_worker
    command: ["bundle", "exec", "sidekiq"]
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379/1
      XAI_API_KEY: ${XAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/rails/storage

volumes:
  postgres_data:
  redis_data:
  storage_data:
